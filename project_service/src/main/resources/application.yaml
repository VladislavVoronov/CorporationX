spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${CORPORATIONX_DB_URL:jdbc:postgresql://localhost:15432/corporationx}
    username: ${CORPORATIONX_DB_USER:user}
    password: ${CORPORATIONX_DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: ${CORPORATIONX_REDIS_PORT:16379}
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8082

logging:
  level:
    root: info

calculations_messages_processing:
  enabled: true

services:
  s3:
    endpoint: ${CORPORATIONX_S3_ENDPOINT:http://localhost:19000}
    accessKey: user
    secretKey: password
    bucketName: projectbucket
    isMocked: false
  payment-service:
    host: http://localhost
    port: 9080
  user-service:
    host: http://localhost
    port: 8080