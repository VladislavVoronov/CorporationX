spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${CORPORATIONX_DB_URL:jdbc:postgresql://localhost:15432/corporationx}
    username: ${CORPORATIONX_DB_USER:user}
    password: ${CORPORATIONX_DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: ${CORPORATIONX_REDIS_PORT:16379}
      host: localhost
      channels:
        calculations_channel:
          name: calculations_channel

server:
  port: 8081

logging:
  level:
    root: info

user-service:
  host: localhost
  port: 8080
project-service:
  host: localhost
  port: 8082
payment-service:
  host: localhost
  port: 9080
